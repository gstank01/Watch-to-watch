# Where each "Watch on …" button goes.
#
# TMDB doesn't give a link to a title on each service, so we send people
# straight to the service: to its own search for the title (`search_url`,
# where {query} becomes the title), or to its home page (`home_url`) when we
# don't have a search link we've checked works.
#
# - Leave out `region` for a link that works everywhere; add an entry with
#   `region` to override it for one country.
# - Only add a `search_url` after opening it in a browser (with a real title in
#   place of {query}) and seeing that service's search results.
# - No affiliate or tracking parameters, ever.
# - Services not listed here fall back to the title's page on TMDB.
#
# provider_id is the TMDB watch-provider id; `npm run verify-providers` checks them.

- provider_id: 8
  provider_name: Netflix
  home_url: https://www.netflix.com/
  search_url: https://www.netflix.com/search?q={query}

- provider_id: 9
  provider_name: Amazon Prime Video
  home_url: https://www.primevideo.com/
- provider_id: 9
  provider_name: Amazon Prime Video
  region: GB
  home_url: https://www.amazon.co.uk/gp/video/storefront
  search_url: https://www.amazon.co.uk/s?k={query}&i=instant-video

- provider_id: 10
  provider_name: Amazon Video
  region: GB
  home_url: https://www.amazon.co.uk/gp/video/storefront
  search_url: https://www.amazon.co.uk/s?k={query}&i=instant-video

